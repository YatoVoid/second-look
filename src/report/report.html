<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Second Look report</title>
  <link rel="stylesheet" href="report.css">
  <link rel="icon" href="../icons/icon-32.png">

<body>
  <div class="page">
    <div class="bar"><span>SECOND LOOK: FULL REVIEW</span><span id="host"></span></div>

      <button type="button" data-key="p" id="print"><kbd>P</kbd>Print or save PDF</button>
